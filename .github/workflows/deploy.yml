name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 壊れた JS を配信しないよう、デプロイ前に構文を確認する。
      - name: Syntax check
        run: |
          for f in game-deploy-v2/js/*.js; do
            node --check "$f" || exit 1
          done

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy game-deploy-v2
            --project-name=great-railway-republic
            --branch=main

      # デプロイ成功の通知だけでは「本当に反映されたか」は分からないので、
      # 配信中のファイルをリポジトリの内容と突き合わせる。
      # 反映待ちがあるため、最大5回まで間隔を空けて再試行する。
      - name: Verify production matches the repository
        run: |
          for attempt in 1 2 3 4 5; do
            if node scripts/verify-deploy.mjs; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          echo "production does not match the repository"
          exit 1
